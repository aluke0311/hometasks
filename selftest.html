<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home Tasks — self-test</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         margin: 0; padding: 24px; line-height: 1.5; max-width: 900px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 20px; }
  #summary { font-size: 17px; font-weight: 600; padding: 12px 16px; border-radius: 8px;
             margin-bottom: 20px; background: #eee; }
  #summary.pass { background: #eaf3de; color: #3b6d11; }
  #summary.fail { background: #fcebeb; color: #b3312f; }
  .group { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
           color: #888; margin: 22px 0 8px; font-weight: 600; }
  .case { padding: 7px 12px; border-left: 3px solid transparent; font-size: 13px;
          display: flex; gap: 10px; align-items: baseline; }
  .case.ok   { border-left-color: #3b6d11; }
  .case.bad  { border-left-color: #e24b4a; background: #fcebeb; }
  .case .id  { font-variant-numeric: tabular-nums; color: #888; min-width: 34px; }
  .case .msg { color: #b3312f; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .note { font-size: 12px; color: #777; margin-top: 24px; padding-top: 12px;
          border-top: 1px solid #ddd; }
  /* Parked off-screen, NOT display:none — a display:none subtree has no layout, so
     every getBoundingClientRect() would return 0 and layout assertions would pass
     on zeros. Keep it rendered but out of sight. */
  #frame { position: absolute; left: -10000px; top: 0; width: 390px; height: 844px; border: 0; }
</style>
</head>
<body>

<h1>Home Tasks — self-test</h1>
<div class="sub">Loads <code>index.html</code> fresh (no-store) into an isolated iframe and asserts against its live functions.</div>
<div id="summary">Running…</div>
<div id="results"></div>
<div class="note">
  The app inside the frame runs against <b>memory-backed storage</b>, not your real
  <code>hometasks_v8</code> key — case 2 proves it. Nothing here can touch live data.
</div>
<iframe id="frame"></iframe>

<script>
// ─── Bridge injected into the app document ─────────────────────────────────
// Runs before the app's own <script>, which sits at the end of <body>.
const BRIDGE = `<script>
(function () {
  function makeStore() {
    const mem = Object.create(null);
    return {
      getItem: k => (k in mem ? mem[k] : null),
      setItem: (k, v) => { mem[k] = String(v); },
      removeItem: k => { delete mem[k]; },
      clear: () => { for (const k in mem) delete mem[k]; },
      key: i => { const ks = Object.keys(mem); return i < ks.length ? ks[i] : null; },
      get length() { return Object.keys(mem).length; }
    };
  }
  // The harness is same-origin, so without this the app would read and write the
  // REAL hometasks_v8 key: init() runs autoBackupCheck(), every mutation saves,
  // and a test fixture would land in live data. Swap storage before the app loads.
  Object.defineProperty(window, 'localStorage',   { value: makeStore(), configurable: true });
  Object.defineProperty(window, 'sessionStorage', { value: makeStore(), configurable: true });
  // App globals are top-level const/let in a classic script, so they live in the
  // shared global lexical environment rather than on window. An eval running
  // inside this document is the only way the parent frame can reach them.
  window.__get = expr => eval(expr);
  window.__set = (lhs, val) => {
    window.__inbound = val;
    try { eval(lhs + ' = window.__inbound'); } finally { delete window.__inbound; }
  };
  window.confirm = () => true;   // applyImport asks for confirmation
  window.alert = () => {};
  window.__bridged = true;
})();
<\/script>`;

const results = [];
let currentGroup = '';

function group(name) { currentGroup = name; }
function record(id, name, err) {
  results.push({ id, name, group: currentGroup, err });
}

// ─── Assertions ────────────────────────────────────────────────────────────
function ok(cond, msg) { if (!cond) throw new Error(msg || 'expected truthy'); }
function eq(a, b, msg) {
  if (a !== b) throw new Error((msg ? msg + ': ' : '') + 'expected ' + JSON.stringify(b) + ', got ' + JSON.stringify(a));
}
function near(a, b, eps, msg) {
  if (!(Math.abs(a - b) <= eps)) throw new Error((msg ? msg + ': ' : '') + 'expected ~' + b + ' (±' + eps + '), got ' + a);
}
function deepEq(a, b, msg) {
  const sa = JSON.stringify(a), sb = JSON.stringify(b);
  if (sa !== sb) throw new Error((msg ? msg + ': ' : '') + 'objects differ\n  A: ' + sa.slice(0, 300) + '\n  B: ' + sb.slice(0, 300));
}

// ─── Harness ───────────────────────────────────────────────────────────────
const DAY = 86400000;
let W, G, S, src;

function fresh() { return G('defaultState')(); }
function switchTabQuiet(tab) { G('switchTab')(tab); }
function snap()  { return JSON.parse(JSON.stringify(G('state'))); }

// Every case that touches state runs through this: build a fixture from a fresh
// default state, run, and restore the frame's real state in a finally.
function withState(build, fn) {
  const saved = snap();
  try {
    const st = fresh();
    build(st);
    S('state', st);
    return fn(st);
  } finally {
    S('state', saved);
  }
}

async function boot(url) {
  const res = await fetch(url, { cache: 'no-store' });
  // A 404 must never be silent — that is how a suite scores nothing and reports green.
  if (!res.ok) throw new Error('fetch ' + url + ' failed: HTTP ' + res.status);
  src = await res.text();

  const injected = src.replace(/<head>/i, '<head>' + BRIDGE);
  if (injected === src) throw new Error('bridge injection failed: no <head> in ' + url);

  const frame = document.getElementById('frame');
  await new Promise((resolve, reject) => {
    frame.addEventListener('load', resolve, { once: true });
    setTimeout(() => reject(new Error('iframe load timed out')), 15000);
    frame.srcdoc = injected;
  });

  W = frame.contentWindow;
  if (!W.__bridged) throw new Error('bridge did not run inside the frame');
  G = expr => W.__get(expr);
  S = (lhs, val) => W.__set(lhs, val);

  // init() is async (it awaits loadState), so wait for it to have dealt a hand.
  const deadline = Date.now() + 10000;
  while (Date.now() < deadline) {
    try { if (G('state') && G('state').handDate) break; } catch (e) {}
    await new Promise(r => setTimeout(r, 30));
  }
  if (!G('state') || !G('state').handDate) throw new Error('app did not finish init() inside the frame');
}

// ═══════════════════════════════════════════════════════════════════════════
//  CASES
// ═══════════════════════════════════════════════════════════════════════════
const cases = [];
function test(name, fn) { cases.push({ name, group: currentGroup, fn }); }

// ─── Harness integrity ─────────────────────────────────────────────────────
group('Harness integrity');

test('the frame is running the code we just fetched, not a cached copy', () => {
  const live = G('scoreTask').toString();
  ok(src.indexOf(live) !== -1, 'scoreTask source not found in the fetched text — the frame is stale');
  const live2 = G('dealHand').toString();
  ok(src.indexOf(live2) !== -1, 'dealHand source not found in the fetched text — the frame is stale');
});

test('the frame cannot see or write real localStorage', () => {
  ok(W.localStorage !== window.localStorage, 'frame shares the parent Storage object');
  const probe = '__selftest_probe_' + Date.now();
  W.localStorage.setItem(probe, 'x');
  eq(window.localStorage.getItem(probe), null, 'a write inside the frame reached real storage');
  eq(W.localStorage.getItem('hometasks_v8') === REAL_STATE_AT_START, false, 'frame is reading the real key');
});

// ─── Preset integrity ──────────────────────────────────────────────────────
group('Preset integrity');

// Tidy Everywhere shipped and this sweep never saw it, because the list of
// constants was hand-maintained. Registered preset types are now pulled through
// getNewPresetSections(), so a new preset is covered the moment it is wired up.
const REGISTERED_PRESET_TYPES = ['expressReset','tidyEverywhere','weeklyReset','returnHome',
                                 'beforeCleaners','recovery','postIllness'];

function collectPresetIds() {
  const out = [];
  const push = (where, id) => out.push({ where, id });
  REGISTERED_PRESET_TYPES.forEach(type => {
    const secs = G('getNewPresetSections')(type) || [];
    if (!secs.length) push('getNewPresetSections', '<' + type + ' resolves to nothing>');
    secs.forEach(sec => (sec.ids || []).forEach(id => push('preset:' + type, id)));
  });
  ['FULL_RESET_SECTIONS','GOING_OUT_SECTIONS'].forEach(name => {
    (G(name) || []).forEach(sec => (sec.ids || []).forEach(id => push(name, id)));
  });
  ['EVENING_SHUTDOWN_FIXED','EVENING_TIDY_POOL',
   'GUEST_DAY_IDS','GUEST_OVERNIGHT_IDS','GUEST_EMERGENCY_IDS'].forEach(name => {
    (G(name) || []).forEach(id => push(name, id));
  });
  (G('ROOM_PRESETS') || []).forEach(r => {
    (r.quick || []).forEach(id => push('ROOM_PRESETS.' + r.id + '.quick', id));
    (r.deep  || []).forEach(id => push('ROOM_PRESETS.' + r.id + '.deep',  id));
  });
  // These two define their own task objects, but the checklist still routes
  // check-off through completeTask(id), which returns early on an unknown id.
  ['FULL_RESET_TASKS','GOING_OUT_TASKS'].forEach(name => {
    (G(name) || []).forEach(t => push(name, t.id));
  });
  return out;
}

test('every preset task id resolves in TASKS', () => {
  const known = new Set(G('TASKS').map(t => t.id));
  const dead = collectPresetIds().filter(r => !known.has(r.id));
  ok(dead.length === 0, 'dead preset ids: ' + dead.map(r => r.where + '→' + r.id).join(', '));
});

// Closes the loop on the list above: whatever the Presets tab can actually
// generate must be in REGISTERED_PRESET_TYPES, so a new preset cannot ship with
// its ids unchecked the way Tidy Everywhere did.
test('every preset the Presets tab can generate is covered by the id sweep', () => {
  const saved = snap();
  try {
    S('state', fresh());
    switchTabQuiet('presets');
    const html = G('document').getElementById('presetsContent').innerHTML;
    const found = new Set();
    html.replace(/generateNewPreset\('([^']+)'\)/g, (_, t) => { found.add(t); return _; });
    ok(found.size > 0, 'no generateNewPreset buttons found — selector is stale');
    const missing = [...found].filter(t => !REGISTERED_PRESET_TYPES.includes(t));
    eq(missing.length, 0, 'preset types not covered by collectPresetIds: ' + missing.join(', '));
  } finally { S('state', saved); switchTabQuiet('alina'); }
});

test('every ROOM_PRESETS label names a room that exists in TASKS', () => {
  const rooms = new Set(G('TASKS').map(t => t.room));
  const bad = (G('ROOM_PRESETS') || []).filter(r => !rooms.has(r.label)).map(r => r.label);
  ok(bad.length === 0, 'labels with no matching task room: ' + bad.join(', '));
});

// ─── Scoring ───────────────────────────────────────────────────────────────
group('Scoring');

// A plain object is enough: scoreTaskParts only reads id, freq, room and cat,
// and looks the rest up in state. No need to register the task.
const T = (over) => Object.assign({ id: 'zz_probe', name: 'Probe', room: 'Kitchen', freq: 10, time: 5, owner: 'either', cat: false }, over || {});

test('score components take their exact documented values', () => {
  // freq 10, last done 15 days ago → 5 days overdue → ratio 0.5, weight 0.5 → -2.5
  // starvation 4 → -min(4*0.3, 10*0.15) = -1.2
  withState(st => {
    st.completions['zz_probe'] = Date.now() - 15 * DAY;
    st.starvation['zz_probe'] = 4;
    st.mode = 'maintenance';
  }, () => {
    const p = G('scoreTaskParts')(T(), 0);
    eq(p.base, 10, 'base');
    eq(p.cat, 0, 'cat');
    eq(p.zone, 0, 'zone');
    near(p.overdue, -2.5, 0.01, 'overdue');
    near(p.starvation, -1.2, 0.001, 'starvation');
    eq(p.flagged, 0, 'flagged');
    near(p.total, 6.3, 0.02, 'total');
  });
});

test('starvation reduction is capped at freq * 0.15', () => {
  withState(st => {
    st.completions['zz_probe'] = Date.now();
    st.starvation['zz_probe'] = 999;
  }, () => {
    const p = G('scoreTaskParts')(T({ freq: 7 }), 0);
    near(p.starvation, -1.05, 0.001, '7 * 0.15');
    const p2 = G('scoreTaskParts')(T({ freq: 180 }), 0);
    near(p2.starvation, -27, 0.001, '180 * 0.15');
  });
});

// The overdue relief stops at `freq - NEGLECT_FLOOR`, not at `freq * 0.8`. The old
// cap left every task a floor of `freq * 0.05`, which scaled with the interval, so
// a 365-day task could never score below 18.25 while routine work sits between 0.5
// and 6 — it could not be dealt at any level of neglect. These cases pin the new
// cap AND the property that made the change necessary: the floor is the same for
// every interval.
test('catch-up gives every task the same floor, whatever its interval', () => {
  withState(st => { st.mode = 'catchup'; st.completions['zz_probe'] = Date.now() - 5000 * DAY; }, () => {
    near(G('scoreTaskParts')(T({ freq: 10 }), 0).overdue, -7, 0.001, 'freq 10 -> 10 - 3');
    near(G('scoreTaskParts')(T({ freq: 90 }), 0).overdue, -87, 0.001, 'freq 90 -> 90 - 3');
    // The property that made the change necessary: the floor no longer scales with
    // the interval, so a 365-day task can reach the range routine work occupies.
    const floors = [7, 30, 90, 180, 365].map(f => {
      const p = G('scoreTaskParts')(T({ freq: f }), 0);
      return p.base + p.overdue;
    });
    floors.forEach(v => near(v, 3, 0.001, 'catch-up floor should be NEGLECT_FLOOR for every interval'));
    ok(floors[0] < 6, 'floor must sit inside the range routine tasks score in');
  });
});

// Keep Up deliberately keeps the old proportional limit. Two attempts to give it
// the absolute floor were measured against real data and both made the everyday
// hand worse — tier A fell from 6 tasks to 2, because badly neglected tier B and C
// tasks are heavy and a few of them eat a budget that held six small routine ones.
// If this case ever fails, someone has given Keep Up the floor again; check the
// everyday hand before deciding that is what you want.
test('keep-up keeps the proportional limit, so the everyday hand is unchanged', () => {
  withState(st => { st.mode = 'maintenance'; st.completions['zz_probe'] = Date.now() - 5000 * DAY; }, () => {
    near(G('scoreTaskParts')(T({ freq: 10 }), 0).overdue, -8, 0.001, 'freq 10 -> 10 * 0.8');
    const floor365 = (() => { const p = G('scoreTaskParts')(T({ freq: 365 }), 0); return p.base + p.overdue; })();
    near(floor365, 73, 0.001, 'a 365-day task still floors far above routine work in keep-up');
  });
});

test('a task shorter than the floor is never pushed up by it', () => {
  withState(st => { st.completions['zz_probe'] = Date.now() - 5000 * DAY; }, () => {
    // freq 1 and 2 are below NEGLECT_FLOOR; Math.max(0, ...) must keep the relief
    // non-negative rather than turning it into a penalty.
    [1, 2, 3].forEach(f => {
      const p = G('scoreTaskParts')(T({ freq: f }), 0);
      ok(p.overdue <= 0, 'freq ' + f + ': overdue relief went positive');
      ok(p.base + p.overdue >= 0, 'freq ' + f + ': score went negative');
    });
  });
});

test('keep-up and catch-up reach the floor at different neglect, so they differ', () => {
  // The old shared cap meant both modes scored a well-overdue task identically.
  // At 1.5x a 20-day interval, catch-up must already be lower than keep-up.
  const build = st => { st.completions['zz_probe'] = Date.now() - 50 * DAY; };
  const keep = withState(st => { build(st); st.mode = 'maintenance'; }, () => G('scoreTaskParts')(T({ freq: 20 }), 0).total);
  const cat  = withState(st => { build(st); st.mode = 'catchup';     }, () => G('scoreTaskParts')(T({ freq: 20 }), 0).total);
  ok(cat < keep, 'catch-up must rank a neglected task higher than keep-up does');
});

test('overdue weight is 0.5 in keep-up and 0.8 in catch-up', () => {
  const build = st => { st.completions['zz_probe'] = Date.now() - 15 * DAY; };
  const keep = withState(st => { build(st); st.mode = 'maintenance'; }, () => G('scoreTaskParts')(T(), 0).overdue);
  const cat  = withState(st => { build(st); st.mode = 'catchup';     }, () => G('scoreTaskParts')(T(), 0).overdue);
  near(keep, -2.5, 0.01, 'keep-up');
  near(cat,  -4.0, 0.01, 'catch-up');
});

test('a flagged task scores 50 lower than the same task unflagged', () => {
  withState(st => { st.completions['zz_probe'] = Date.now() - 15 * DAY; }, () => {
    const plain = G('scoreTaskParts')(T(), 0).total;
    S('state.flaggedIds', ['zz_probe']);
    const flagged = G('scoreTaskParts')(T(), 0).total;
    near(flagged - plain, -50, 0.001);
  });
});

test('zone bonus applies in-zone only, and never to zone-less rooms', () => {
  withState(st => { st.completions['zz_probe'] = Date.now(); }, () => {
    eq(G('scoreTaskParts')(T({ room: 'Kitchen' }), 2).zone, -2, 'Kitchen in zone 2');
    eq(G('scoreTaskParts')(T({ room: 'Kitchen' }), 4).zone, 0, 'Kitchen in zone 4');
    ['Whole House', 'Robot', 'Downstairs', 'Upstairs'].forEach(room => {
      for (let z = 1; z <= 5; z++) {
        eq(G('scoreTaskParts')(T({ room }), z).zone, 0, room + ' in zone ' + z);
      }
    });
  });
});

// ─── Dealing ───────────────────────────────────────────────────────────────
group('Dealing');

// Derived from the `load: true` flag rather than copied, so the probe filter can
// never drift out of sync with the app's own notion of a laundry load. A function,
// not a const: G() is only bound once the frame has booted, well after parse time.
function loadIds() { return G('getAllTasks')().filter(t => t.load).map(t => t.id); }
const PROCESS_IDS = ['l_start','l_dryer','l_fold','l_put_away'];

// Pick a probe task by its properties rather than hardcoding an id. Hardcoding
// cost a vacuous case once already: bed_sheets is owner 'bob', so it never enters
// the dealing pool, and the case only passed because the fixture had accidentally
// marked it completed-today.
function probeTask(opts) {
  const o = opts || {};
  const t = G('getAllTasks')().find(t =>
    (t.owner === 'alina' || t.owner === 'either') &&
    t.freq >= (o.minFreq || 5) && t.freq <= (o.maxFreq || 30) &&
    !t.oneOff &&
    loadIds().indexOf(t.id) === -1 && PROCESS_IDS.indexOf(t.id) === -1 && t.id !== 'c_fountain' &&
    G('inSeason')(t)
  );
  if (!t) throw new Error('no suitable probe task found in TASKS');
  return t;
}

// Deal a hand from a controlled fixture and hand back the resulting task objects.
function deal(build) {
  return withState(st => {
    st.hand = null; st.handDate = null;
    st.pinnedIds = []; st.flaggedIds = []; st.inProgress = {};
    st.removedToday = []; st.snoozed = {};
    if (build) build(st);
  }, () => {
    G('dealHand')();
    const all = G('getAllTasks')();
    return {
      ids: G('state').hand.slice(),
      tasks: G('state').hand.map(id => all.find(t => t.id === id)).filter(Boolean),
      state: snap()
    };
  });
}

test('the dealt hand stays within budget, bar one boundary task', () => {
  const budget = 45;
  const r = deal(st => { st.budgetWeekday = budget; st.budgetWeekend = budget; });
  const alwaysIds = new Set(['c_fountain', ...loadIds()]);
  const counted = r.tasks.filter(t => t.freq > 1 && !alwaysIds.has(t.id));
  const times = counted.map(t => G('taskTime')(t));
  const total = times.reduce((a, b) => a + b, 0);
  const biggest = times.length ? Math.max(...times) : 0;
  // dealHand lets the FIRST selection overshoot ("&& selected.length > 0"), so the
  // honest invariant is that dropping one task brings the hand back under budget.
  ok(total - biggest <= budget, 'budget ' + budget + ', dealt ' + total + 'm across ' + counted.length + ' tasks (largest ' + biggest + 'm)');
});

test('the laundry load set is populated and holds the colour loads', () => {
  // Guard for the two cases below. Both derive their subject from loadIds(), so an
  // empty set makes them pass vacuously (0 loads is "at most one", and "no process
  // steps" is trivial when nothing can be washed). Stripping `load: true` from every
  // task must fail HERE, or the split's slot behaviour is untested.
  const ids = loadIds();
  ok(ids.length >= 5, 'expected the wash slot to have contenders, got ' + ids.length);
  ['lroom_whites','lroom_cools','lroom_warms','lroom_towels','lroom_microfiber','k_towels']
    .forEach(id => ok(ids.indexOf(id) !== -1, id + ' is not marked as a laundry load'));
  // The split replaced this one; a stale id here would quietly re-open the slot to it.
  eq(G('getAllTasks')().some(t => t.id === 'lroom_myclothes'), false, 'lroom_myclothes should be gone');
});

test('at most one laundry load task per hand', () => {
  const r = deal();
  const loads = r.ids.filter(id => loadIds().indexOf(id) !== -1);
  ok(loads.length <= 1, 'got ' + loads.length + ' load tasks: ' + loads.join(', '));
});

// ─── Cycles ────────────────────────────────────────────────────────────────
// A cycle is a multi-stage job (wash → dryer → fold → away) held as an INSTANCE
// in state.cycles. The stages are ordinary tasks that must never be scheduled on
// their own, and the LOAD only completes when its last stage does.

test('every cycle stage id resolves in TASKS', () => {
  // Same trap as the preset id sweep: a stage naming a task that does not exist
  // would make the cycle un-advanceable, because completeTask returns early on an
  // unknown id and the stage would never bank.
  const all = G('getAllTasks')();
  const defs = G('CYCLES');
  Object.keys(defs).forEach(k => {
    defs[k].stages.forEach(s => {
      ok(all.some(t => t.id === s.task), 'cycle ' + k + ' stage names a missing task: ' + s.task);
    });
  });
});

test('cycle stages are never dealt on their own, load due or not', () => {
  // Replaces "process steps are suppressed when no load is assigned". That case
  // asserted the OLD conditional rule and went vacuous the moment stages stopped
  // being dailies at all. The rule now is unconditional, so probe both states.
  const stageIds = G('CYCLE_STAGE_IDS');
  ok(stageIds.size >= 4, 'the stage set is empty — every assertion below is vacuous');

  const nothingDue = deal(st => {
    // Two days ago, not today: every load is freq 7 or 14 so none is due, and
    // dealHand adds anything completed TODAY back in, defeating the precondition.
    loadIds().forEach(id => { st.completions[id] = Date.now() - 2 * DAY; });
  });
  eq(nothingDue.ids.filter(id => loadIds().indexOf(id) !== -1).length, 0, 'precondition: no load assigned');
  ok(nothingDue.ids.filter(id => stageIds.has(id)).length === 0,
     'stages leaked in with nothing to wash: ' + nothingDue.ids.filter(id => stageIds.has(id)).join(', '));

  const loadDue = deal();
  eq(loadDue.ids.filter(id => loadIds().indexOf(id) !== -1).length, 1, 'precondition: a load was assigned');
  ok(loadDue.ids.filter(id => stageIds.has(id)).length === 0,
     'stages leaked in alongside a load: ' + loadDue.ids.filter(id => stageIds.has(id)).join(', '));
});

test('cycle stages accrue no starvation', () => {
  withState(st => {
    st.hand = null; st.handDate = null; st.starvationDate = null; st.starvation = {};
    G('CYCLE_STAGE_IDS').forEach(id => { st.completions[id] = Date.now() - 30 * DAY; });
  }, () => {
    G('dealHand')();
    G('CYCLE_STAGE_IDS').forEach(id => {
      eq((G('state').starvation || {})[id] || 0, 0, id + ' accrued starvation despite never being dealable');
    });
  });
});

test('ticking a load starts its cycle instead of completing it', () => {
  const load = 'lroom_whites';
  withState(st => {
    st.hand = null; st.handDate = null;

// ─── State and time ────────────────────────────────────────────────────────
group('State & time');

// taskTime shrinks the observed median toward the static estimate, weight
// n/(n+2). The old contract — ignore everything under 3 samples, then switch
// hard to the raw median — meant one timed run taught the app nothing and the
// third moved it in a lurch. These cases pin the new curve at each end AND the
// two properties that matter: it always moves toward reality, and it never
// overshoots past the observed median.
test('taskTime blends observed time toward the static estimate, by sample count', () => {
  const t = T({ id: 'zz_time', time: 10 });
  const run = samples => withState(st => { st.actualTimes = {}; st.actualTimes['zz_time'] = samples; },
                                   () => G('taskTime')(t));
  eq(run([]), 10, 'no samples → static estimate');
  eq(run([30]), 17, '1 sample: 1/3 of the way (0.333*30 + 0.667*10)');
  eq(run([30, 30]), 20, '2 samples: halfway');
  eq(run([20, 30, 40]), 22, '3 samples: 0.6*30 + 0.4*10');
  eq(run([40, 20, 30]), 22, 'unsorted 3 samples give the same answer');
  eq(run([30, 30, 30, 30]), 23, '4 samples: 2/3 of the way');
  eq(run([5]), 8, 'shrinks upward too when reality is faster');
  // A forgotten timer is one wild high sample; the median must absorb it.
  eq(run([10, 10, 600]), 10, 'median ignores a runaway sample');
  // Monotonic: more evidence never moves the estimate back toward the prior.
  const a = run([30]), b = run([30, 30]), c = run([30, 30, 30]);
  ok(a < b && b < c, 'more samples move further toward the observed time');
  ok(c < 30, 'never overshoots the observed median');
});

test('derived minutes improve when the time estimate does (the point of deriving)', () => {
  const probe = probeTask();
  const Y = new Date().getFullYear();
  const build = st => {
    st.completionHistory = {};

  };
  const before = withState(build, () => G('deriveYearStats')(Y).minutes);
  const after = withState(st => {
    build(st);
    // Three samples ten minutes over the estimate. taskTime shrinks that toward
    // the static number with weight 3/(3+2) = 0.6, so the learned time is
    // static + 6, not static + 10.
    st.actualTimes = {}; st.actualTimes[probe.id] = [probe.time + 10, probe.time + 10, probe.time + 10];
  }, () => G('deriveYearStats')(Y).minutes);
  const learned = Math.round(0.6 * (probe.time + 10) + 0.4 * probe.time);
  eq(before, probe.time * 2, 'before: static estimate');
  eq(after, learned * 2, 'after: the blended learned time, over two completions');
  ok(after > before, 'a stored accumulator could not have moved here');
  ok(learned > probe.time && learned < probe.time + 10, 'blend lands between estimate and observation');
});

test('the day budget is a total: dailies are charged against it, not exempt from it', () => {
  const BUDGET = 90;
  // Two probes at the SAME total, differing only in how much of it the dailies
  // eat. If the daily load is charged, deleting 28m of laundry steps has to buy
  // back room for extras; if it is exempt (the old bug) both probes are identical.
  function probe(deletedIds) {
    const saved = snap();
    try {
      const st = fresh();
      st.deletedIds = deletedIds;
      S('state', st);
      G('setDayBudget')(BUDGET);
      const hand = G('getHandTasks')();
      return {
        extras: hand.filter(t => t.freq > 1).length,
        total:  hand.reduce((s, t) => s + G('taskTime')(t), 0),
      };
    } finally { S('state', saved); }
  }
  // The subject is DERIVED from getDailies() rather than named. It used to delete
  // the four laundry steps; those became cycle stages and stopped being dailies,
  // which turned the probe into a no-op that deleted nothing and compared a hand
  // against itself. A hardcoded list cannot notice that it has stopped testing.
  const dailies = (() => {
    const saved = snap();
    try { S('state', fresh()); return G('getDailies')().map(t => ({ id: t.id, mins: G('taskTime')(t) })); }
    finally { S('state', saved); }
  })();
  const dailyMins = dailies.reduce((s, d) => s + d.mins, 0);
  ok(dailies.length >= 3 && dailyMins >= 15,
     'precondition: only ' + dailyMins + 'm of daily load across ' + dailies.length + ' tasks — too little to move the hand');
  const cut = [...dailies].sort((a, b) => b.mins - a.mins).slice(0, 3);
  const cutMins = cut.reduce((s, d) => s + d.mins, 0);

  const heavy = probe([]);
  const light = probe(cut.map(d => d.id));

  // The promise on the label: slide to 90 and the hand really is about 90. One
  // boundary task of overshoot is allowed, same as the budget case above.
  ok(heavy.total <= BUDGET + 25,
     'a ' + BUDGET + 'm day dealt a ' + heavy.total + 'm hand — dailies are not being charged');
  ok(light.extras > heavy.extras,
     'cutting ' + cutMins + 'm of dailies bought no extra tasks (' + heavy.extras + ' vs ' + light.extras + ')');
});

// ─── Undo, snooze, and getting a task back ─────────────────────────────────
group('Undo, snooze & hand membership');

// The card's "undo" used to fake `now - freq`, which for a twice-yearly task
// moved last-done MONTHS backwards and destroyed the real date. It has to be as
// lossless as the toast's Undo, which is why both are asserted against the same
// timestamp here.
test('uncompleting a task restores the real previous date, not an invented one', () => {
  const id = 'k_oven_int';                                   // freq 180
  withState(st => { st.completions[id] = Date.now() - 30 * DAY; }, () => {
    const before = G('state').completions[id];
    G('completeTask')(id);
    ok(G('state').completions[id] !== before, 'precondition: completion moved to now');
    G('uncompleteTask')(id);
    eq(G('state').completions[id], before, 'undo did not put the real last-done date back');
    eq(G('isDue')(G('getAllTasks')().find(t => t.id === id)), false,
       'a task 30 days into a 180-day cycle must not read as due after an undo');
  });
});

// Same invariant as the case above, reached through the OTHER writer. The stash
// lived inside completeTask alone, so endTaskAsOf — behind "Edit last done" and
// "did it earlier" — never wrote one. Setting last-done to today and then unticking
// found no stash, fell into uncompleteTask's `now - freq` branch, and moved a
// twice-yearly task's real date six months backwards, unrecoverably.
test('setting last-done to today then unticking restores the real previous date', () => {
  const id = 'k_oven_int';                                   // freq 180
  const real = Date.now() - 200 * DAY;
  withState(st => {
    st.completions[id] = real;
    st.completionHistory[id] = [real];
    st.prevCompletions = {};
  }, () => {
    const todayStr = G('todayStr')();
    G('setLastDone')(id, todayStr);
    ok(G('wasCompletedToday')(G('getAllTasks')().find(t => t.id === id)),
       'precondition: the task now reads as completed today');
    G('uncompleteTask')(id);
    eq(G('state').completions[id], real,
       'unticking after "edit last done" invented a date instead of restoring the real one');
  });
});

// Starvation counts days DUE BUT NOT DEALT, so finishing the task must clear it.
// dealHand's daily tick zeroes it for anything in the hand, which hid this: it only
// bites when a task is ticked off a preset checklist or in Sprint, never dealt.
test('completing a task clears its starvation counter even when it was never dealt', () => {
  const id = 'k_oven_int';
  withState(st => {
    st.completions[id] = Date.now() - 400 * DAY;
    st.starvation[id] = 12;
    st.hand = [];                                            // never dealt
    // Load-bearing. dealHand's tick runs once per calendar day and zeroes the
    // counter for anything in the hand — including a task completed today, which
    // stays in the hand so its card can show as done. Leave starvationDate unset
    // and that tick fires AFTER the completion and cleans up regardless, so the
    // case passes against a build with the fix removed. By the time she completes
    // anything the day's tick has already run, so pinning it here is also the
    // honest fixture, not just the one that fails correctly.
    st.starvationDate = G('todayStr')();
  }, () => {
    eq(G('state').starvation[id], 12, 'precondition: the counter is standing at 12');
    G('toggleComplete')(id);                                 // exactly what a preset tick does
    eq(G('state').starvation[id], 0,
       'a task completed outside the hand kept a score bonus it had already spent');
  });
});

group('Vacation decay');

// A pause used to hold every task equally. Now each gets back the share of the
// time away its own setting allows: freeze all of it, half half, full none.
test('resume gives each task back the share of the pause its setting allows', () => {
  const away = 10 * DAY;
  withState(st => {
    st.taskVac = { zz_freeze: 'freeze', zz_half: 'half', zz_full: 'full' };
    ['zz_freeze', 'zz_half', 'zz_full', 'zz_unset'].forEach(id => {
      st.completions[id] = Date.now() - 20 * DAY;
    });
    st.paused = true;
    st.pausedAt = Date.now() - away;
  }, () => {
    const before = {};
    ['zz_freeze', 'zz_half', 'zz_full', 'zz_unset'].forEach(id => { before[id] = G('state').completions[id]; });
    G('resumeApp')();
    const shift = id => (G('state').completions[id] - before[id]) / DAY;
    near(shift('zz_freeze'), 10, 0.2, 'a frozen task should not have aged at all');
    near(shift('zz_half'),    5, 0.2, 'a half-speed task should get back half the trip');
    near(shift('zz_full'),    0, 0.2, 'a normally-ageing task should get nothing back');
    // Unclassified must behave exactly as vacation mode did before this existed.
    near(shift('zz_unset'),  10, 0.2, 'an unset task must default to freeze');
    eq(G('state').paused, false, 'resume did not clear the pause');
  });
});

// Every robot RUN is a passive job you set going first. rob_mop_us was added in
// the per-unit split and missed, so it landed in a one-task block at the very end.
test('every robot run task starts the sprint, not just the downstairs ones', () => {
  withState(st => {}, () => {
    const runs = ['rob_run_ds', 'rob_run_us', 'rob_mop', 'rob_mop_us'];
    G('dealHand')();
    runs.forEach(id => { if (!G('state').hand.includes(id)) G('state').hand.push(id); });
    const launch = (G('getSprintBlocks')().find(b => b.label === 'Launch') || { tasks: [] })
      .tasks.map(t => t.id);
    const stranded = runs.filter(id => !launch.includes(id));
    eq(stranded.length, 0, 'robot runs left out of the Launch block: ' + stranded.join(','));
  });
});

// She logs Bob's completions, so his work looked like spent time and silently
// shrank her own hand. The dealing pool is hers; the budget must be too.
test('completing a Bob-only task does not spend Alina\'s budget', () => {
  const bobIds = ['usb_shower', 'usb_grout'];
  let baseline;
  withState(st => {}, () => {
    G('dealHand')();
    baseline = G('state').hand.length;
  });
  withState(st => { bobIds.forEach(id => { st.completions[id] = Date.now(); }); }, () => {
    G('state').hand = null; G('state').handDate = null;
    G('dealHand')();
    const dealt = G('state').hand.filter(id => !bobIds.includes(id)).length;
    ok(dealt >= baseline, 'Bob\'s ' + bobIds.length + ' completions cut her hand from ' +
       baseline + ' to ' + dealt);
  });
});

// ─── Checklist ticks ───────────────────────────────────────────────────────
group('Checklist ticks');

// Sprint and preset cards used to be wired to completeTask, so a mis-tap was
// uncorrectable once the 5s undo toast expired — tapping the ticked card just
// re-fired the completion.
test('sprint and preset checklist cards toggle rather than only complete', () => {
  withState(st => {}, () => {
    switchTabQuiet('sprint');
    G('render')();
    const sprintHtml = G('document').getElementById('sprintContent').innerHTML;
    // The 2026-08-09 redesign moved Sprint onto the shared task row, so the tick
    // is .task-main rather than .sprint-card. The invariant is unchanged: the row
    // must toggle, never fire completeTask directly.
    ok(/class="task-main" onclick="toggleComplete\(/.test(sprintHtml),
       'no sprint row is wired to toggleComplete — did the row markup change?');
    ok(!/onclick="completeTask\(/.test(sprintHtml),
       'a sprint row is still wired straight to completeTask');

    G('generateNewPreset')('expressReset');
    switchTabQuiet('presets');
    const presetHtml = G('document').getElementById('presetsContent').innerHTML;
    // Preset checklists still build .sprint-card by hand — they aren't hand tasks.
    ok(/class="sprint-card[^"]*"[^>]*onclick="toggleComplete\(/.test(presetHtml),
       'no preset checklist card is wired to toggleComplete');
    ok(!/class="sprint-card[^"]*"[^>]*onclick="completeTask\(/.test(presetHtml),
       'a preset checklist card is still wired straight to completeTask');
  });
  switchTabQuiet('alina');
});

// Nothing re-rendered when the calendar day rolled over under an open session, and
// the phone spends every night with the tab open. The screen kept showing the task
// ticked while wasCompletedToday had flipped underneath it, so tapping the ticked
// card to UNDO ran completeTask and logged a second completion instead.
test('a session left open past midnight knows its screen is stale', () => {
  withState(st => { st.handDate = G('todayStr')(); st.paused = false; }, () => {
    eq(G('isStaleDay')(), false, 'a hand dealt today must not read as stale');
    G('state').handDate = '2020-01-01';                      // the day ended while we sat here
    eq(G('isStaleDay')(), true, 'a hand dealt on a previous day must read as stale');
    // refreshIfDayChanged re-deals through render(); after it, the app is current.
    G('refreshIfDayChanged')();
    eq(G('state').handDate, G('todayStr')(), 'the rollover did not re-deal for the new day');
    eq(G('isStaleDay')(), false, 'still stale after a refresh');
  });
});

// Vacation mode deliberately freezes the hand, so the rollover must not thaw it.
test('the day-rollover refresh does not re-deal while paused', () => {
  withState(st => { st.handDate = '2020-01-01'; st.paused = true; st.pausedAt = Date.now(); }, () => {
    G('refreshIfDayChanged')();
    eq(G('state').handDate, '2020-01-01', 'pausing stopped mattering at midnight');
  });
});

// ─── Controls are visible ──────────────────────────────────────────────────
group('Controls are visible');

// `input, select, textarea { appearance: none }` near the top of the stylesheet
// is a BLANKET reset: it strips the native glyph from every checkbox and radio,
// which then compute to 0x0 with no border and no background unless something
// draws them by hand. This has shipped three times — the cat checkbox, and then
// the three Guest Prep radios, which rendered as bare words with nothing to click
// and no way to see which variant was selected. Nothing in the code looks wrong
// when it happens, which is why it needs a gate rather than a watch-out.
//
// Layout is real here: #frame is parked off-screen but NOT display:none, so
// getBoundingClientRect returns true boxes. Under display:none every element
// measures zero and this case would fail on everything, not on the bug.
test('no checkbox or radio renders at zero size on any tab', () => {
  const doc = G('document');
  // Presets carries the guest radios; the editor sheet carries the checkboxes.
  // Open both, since a control only has a box once its tab is rendered.
  const offenders = [];
  ['alina', 'sprint', 'manage', 'presets', 'stats', 'settings'].forEach(tab => {
    switchTabQuiet(tab);
    G('render')();
    doc.querySelectorAll('input[type="checkbox"], input[type="radio"]').forEach(el => {
      // Every tab's markup stays in the document; only the active one is
      // displayed. A display:none subtree has no layout, so its controls measure
      // 0x0 whether or not they are drawn — offsetParent is null there and null
      // only there. A control killed by the appearance reset is still laid out,
      // so this filter cannot hide the bug being pinned.
      if (el.offsetParent === null) return;
      const r = el.getBoundingClientRect();
      if (r.width < 6 || r.height < 6) {
        offenders.push(tab + ':' + el.type + ':' + (el.name || el.id || el.className || '?') +
                       ' = ' + Math.round(r.width) + 'x' + Math.round(r.height));
      }
    });
  });
  switchTabQuiet('alina');
  // A control found at a real size proves the measurement works at all — without
  // this the case would go green on a page that rendered no controls whatsoever.
  switchTabQuiet('presets');
  G('render')();
  const sized = [...doc.querySelectorAll('input[type="checkbox"], input[type="radio"]')]
    .filter(el => el.getBoundingClientRect().width >= 6);
  switchTabQuiet('alina');
  ok(sized.length > 0, 'no checkbox or radio was measurable at all — the probe is broken, not the app');
  ok(offenders.length === 0, 'invisible control(s): ' + offenders.join(', '));
});

// ─── Version hygiene ───────────────────────────────────────────────────────
group('Version hygiene');

test('APP_VERSION matches the documented YYYY-MM-DD vN format', () => {
  const v = G('APP_VERSION');
  ok(/^\d{4}-\d{2}-\d{2} v\d+$/.test(v), 'APP_VERSION is ' + JSON.stringify(v));
});

// ═══════════════════════════════════════════════════════════════════════════
//  RUN
// ═══════════════════════════════════════════════════════════════════════════
let REAL_STATE_AT_START = null;

// Runs the whole suite against an arbitrary source file and returns the results
// instead of rendering them. This is what makes mutation-checking repeatable:
// point it at a deliberately broken copy of index.html and confirm the cases
// that guard the broken thing actually go red. See runMutants() below.
async function runAgainst(url) {
  results.length = 0;
  REAL_STATE_AT_START = window.localStorage.getItem('hometasks_v8');
  try {
    await boot(url);
  } catch (e) {
    return [{ name: 'HARNESS: ' + url, group: 'Harness integrity', err: e.message || String(e) }];
  }

  for (const c of cases) {
    try {
      const out = c.fn();
      if (out && typeof out.then === 'function') await out;
      record(c.id, c.name, null);
    } catch (e) {
      record(c.id, c.name, e.message || String(e));
    }
    results[results.length - 1].group = c.group;
  }

  // The harness's own guarantee, checked last: the real key is byte-identical.
  const realNow = window.localStorage.getItem('hometasks_v8');
  results.push({ name: 'real localStorage is untouched by the whole run', group: 'Harness integrity',
                 err: realNow === REAL_STATE_AT_START ? null : 'hometasks_v8 CHANGED during the test run' });

  return results.slice();
}
window.runAgainst = runAgainst;

async function run() {
  const url = new URLSearchParams(location.search).get('src') || 'index.html';
  const out = await runAgainst(url);
  if (out.length === 1 && out[0].name.indexOf('HARNESS: ') === 0) {
    const sum = document.getElementById('summary');
    sum.className = 'fail';
    sum.textContent = 'Harness failed to start: ' + out[0].err;
    return;
  }
  render();
}

function render() {
  const el = document.getElementById('results');
  const failed = results.filter(r => r.err);
  const sum = document.getElementById('summary');
  sum.className = failed.length ? 'fail' : 'pass';
  sum.textContent = (results.length - failed.length) + '/' + results.length + ' passed'
                  + (failed.length ? '  —  ' + failed.length + ' FAILED' : '');

  let html = '', seen = '';
  results.forEach((r, i) => {
    if (r.group !== seen) { html += '<div class="group">' + r.group + '</div>'; seen = r.group; }
    html += '<div class="case ' + (r.err ? 'bad' : 'ok') + '">'
          + '<span class="id">' + (r.err ? '✗' : '✓') + ' ' + (i + 1) + '</span>'
          + '<span>' + r.name + (r.err ? '<br><span class="msg">' + String(r.err).replace(/</g, '&lt;').replace(/\n/g, '<br>') + '</span>' : '') + '</span>'
          + '</div>';
  });
  el.innerHTML = html;
}

run();
</script>
